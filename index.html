            ink+=faceMark(faceUV,vec2(.69,.62),vec2(.24,.26),vec4(.025,.745,.125,.155));
            ink+=faceMark(faceUV,vec2(.5,.32),vec2(.50,.28),vec4(.0625,.40,.125,.16));
            vec3 faceColor=mix(vec3(1.0,.83,.48),vec3(.24,.19,.12),clamp(ink,0.0,1.0));
            diffuseColor.rgb=mix(diffuseColor.rgb,faceColor,face);`);
        };
        object.castShadow=true;
      } else if(object.isMesh) {
        // These are facial placement guides, not renderable character parts.
        object.visible=false;
      }
    });
    this.setIdleAnimation();
  }
  setAnimation(name) {
    if (!this.allAnims[name]) name='Idle';
    for(const [key,action]of Object.entries(this.allAnims))action.weight=key===name?1:0;
    this.currentAnimation=name;this.animation=this.allAnims[name];
  }
  setIdleAnimation() { this.setAnimation('Idle'); }
  playEmote(name) { this.setAnimation(name); }
  actionStart() { this.setAnimation('Action'); }
  actionDone() { this.setIdleAnimation(); }
  updateOptions(options={},camera={}) { Object.assign(this.options,options);Object.assign(this.cameraOptions,camera);return Promise.resolve(); }
  async teleportToPoint() { this.base.position.copy(SPAWN);this.verticalSpeed=0;this.scene.camera.snap=true; }
  triggerUpdate() {}
  afterUpdate() {
    const app=this.webgl.app, dt=this.webgl.time.dt/1000;
    this.canMove=!this.scene.camera.locks.size && !app.$store.isCustomizeOpen && !app.$store.isDialogVisible;
    const movement=this.webgl.movement;
    const yaw=app.__hub?.active?this.scene.camera.yaw:0;
    const moveX=movement.x*Math.cos(yaw)-movement.y*Math.sin(yaw);
    const moveZ=movement.x*Math.sin(yaw)+movement.y*Math.cos(yaw);
    const running=this.canMove && !app.__danceState?.holding && !app.__runner?.active;
    if (running) {
      this.base.position.x+=moveX*this.options.speed*dt;
      this.base.position.z+=moveZ*this.options.speed*dt;
      if(movement.lengthSq()>.001)this.base.rotation.y=Math.atan2(moveX,moveZ);
    }
    if (!app.__runner?.active) {
      if(this.joystick.direction.y>0 && this.scene.physics.playerDistanceFromFloor<.15)this.verticalSpeed=9.4;
      this.verticalSpeed-=this.scene.physics.gravity*dt;
      this.base.position.y=Math.max(SPAWN.y,this.base.position.y+this.verticalSpeed*dt);
      if(this.base.position.y===SPAWN.y)this.verticalSpeed=0;
      this.base.position.x=THREE.MathUtils.clamp(this.base.position.x, WEST_MIN_X+.6,WEST_MAX_X-.6);
      this.base.position.z=THREE.MathUtils.clamp(this.base.position.z, WEST_MIN_Z+.6,WEST_MAX_Z-.6);
      this.scene.physics.playerDistanceFromFloor=this.base.position.y-SPAWN.y;
      this.scene.physics.playerIsCollidingGround=this.base.position.y<=SPAWN.y+.02;
      this.isOnFloorDebounced=this.scene.physics.playerIsCollidingGround;
      const next=app.__danceState?.holding?'Action':running&&movement.lengthSq()>.001?'Run':'Idle';
      if(app.__survival?.run.phase!=='won'&&this.currentAnimation!==next)this.setAnimation(next);
    }
    this.animationMixer.update(dt);
    this.contactShadow.visible=!app.__runner?.active;
    this.contactShadow.position.set(this.base.position.x,SPAWN.y-.25,this.base.position.z);
    const shadowHeight=Math.max(0,this.base.position.y-SPAWN.y);
    this.contactShadow.scale.setScalar(1+shadowHeight*.22);
    this.contactShadow.material.opacity=.2/(1+shadowHeight*.55);
  }
}

// Arcade scenes borrow the authorized GLORB mesh and clips, with independent
// bones and materials so a minigame cannot change the hub player's pose.
function createGlorbAvatar(app) {
  const original=app.$webgl.scenes.list.IslandWest.player;
  const source=original.base;
  const group=source.clone(true);
  const clones=new Map();
  const pair=(from,to)=>{clones.set(from,to);from.children.forEach((child,index)=>pair(child,to.children[index]));};
  pair(source,group);
  const materials=new Map();
  source.traverse(object=>{
    const copy=clones.get(object);
    if(!object.isMesh)return;
    const duplicate=surface=>{
      if(!materials.has(surface)){
        const material=surface.clone();
        material.onBeforeCompile=surface.onBeforeCompile;
        materials.set(surface,material);
      }
      return materials.get(surface);
    };
    copy.material=Array.isArray(object.material)?object.material.map(duplicate):duplicate(object.material);
    if(object.isSkinnedMesh){
      const bones=object.skeleton.bones.map(bone=>clones.get(bone));
      if(bones.some(bone=>!bone))throw Error('GLORB avatar is missing a character bone');
      copy.skeleton=new THREE.Skeleton(bones,object.skeleton.boneInverses.map(matrix=>matrix.clone()));
      copy.bindMatrix.copy(object.bindMatrix);copy.bindMatrixInverse.copy(object.bindMatrixInverse);
      copy.frustumCulled=false;
    }
  });
  group.name='glorb-arcade-avatar';group.position.set(0,0,0);group.rotation.set(0,0,0);group.scale.setScalar(.01);
  const mixer=new THREE.AnimationMixer(group),actions={};
  for(const [name,action]of Object.entries(original.allAnims)){
    actions[name]=mixer.clipAction(action.getClip());actions[name].play();actions[name].weight=0;
  }
  let current=null, bodyColor=null;
  const avatar={group,mixer,actions,
    syncAppearance(){
      for(const [source,copy]of materials)if(source.color&&copy.color)copy.color.copy(source.color);
      if(bodyColor)group.traverse(object=>{
        if(!object.isSkinnedMesh)return;
        for(const surface of Array.isArray(object.material)?object.material:[object.material])surface.color?.copy(bodyColor);
      });
      app.__hatShop?.applyHatToAvatar(avatar);
    },
    setBodyColor(color){
      bodyColor=color===null?null:new THREE.Color(color);this.syncAppearance();
    },
    setAnimation(name){
      const next=actions[name]||actions.Idle;if(current===next)return;
      if(current)current.fadeOut(.12);
      next.reset().setEffectiveWeight(1).fadeIn(.12).play();current=next;
      group.userData.animation=name;
    },
    update(dt){mixer.update(dt);},
    dispose(){
      app.__hatShop?.removeHatFromAvatar(avatar);
      mixer.stopAllAction();mixer.uncacheRoot(group);
      for(const surface of materials.values())surface.dispose();
      group.traverse(object=>{if(object.isSkinnedMesh)object.skeleton.dispose();});
      group.removeFromParent();
    }
  };
  avatar.setAnimation('Idle');app.__hatShop?.applyHatToAvatar(avatar);return avatar;
}

function createWater() {
  // Independent analytic waves. The fragment color uses wave slopes and view
  // distance, without the inherited splatting maps, noise maps or shaders.
  const material=new THREE.ShaderMaterial({
    uniforms:{elapsed:{value:0},nearColor:{value:new THREE.Color('#32bec0')},farColor:{value:new THREE.Color('#b3e9e0')}},
    vertexShader:`varying vec3 waterPosition;
      void main(){vec4 world=modelMatrix*vec4(position,1.0);waterPosition=world.xyz;
      gl_Position=projectionMatrix*viewMatrix*world;}`,
    fragmentShader:`uniform float elapsed;uniform vec3 nearColor;uniform vec3 farColor;
      varying vec3 waterPosition;
      void main(){vec2 p=waterPosition.xz;float wave=sin(p.x*.19+elapsed*.75)*sin(p.y*.23-elapsed*.54);
      wave+=.35*sin(p.x*.71+p.y*.48+elapsed);float distanceToEye=distance(cameraPosition,waterPosition);
      vec2 bend=p*.20+vec2(sin(p.y*.09+elapsed*.18),cos(p.x*.12-elapsed*.13))*.9;
      float ripple=sin(bend.x+elapsed*.24)*cos(bend.y-elapsed*.35);
      vec3 color=nearColor*(.98+wave*.035+ripple*.04);
      float glint=smoothstep(.86,.98,ripple)*(.3+.7*smoothstep(-.1,.7,wave));
      color=mix(color,vec3(.70,.94,.88),glint*.24);
      color=mix(color,farColor,smoothstep(120.0,650.0,distanceToEye));
      gl_FragColor=vec4(color,1.0);}`
  });
  const water=new Mesh(new THREE.PlaneGeometry(6000,6000),material);
  water.rotation.x=-Math.PI/2;water.position.y=.55;return water;
}

function createSky(clouds) {
  const material=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,
    uniforms:{clouds:{value:clouds}},
    vertexShader:`varying vec3 direction;void main(){direction=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`uniform sampler2D clouds;varying vec3 direction;
      void main(){vec3 d=normalize(direction);float up=max(0.0,d.y);
      vec3 color=mix(vec3(.85,.96,.92),vec3(.28,.70,.91),pow(clamp(up*2.2,0.0,1.0),.6));
      vec2 uv=vec2(fract(atan(d.z,d.x)/6.2831853*2.0+.5),clamp(up*5.0,0.0,1.0));
      vec4 cloud=texture2D(clouds,uv);float cover=smoothstep(.35,.85,cloud.r)*.42*(1.0-smoothstep(.12,.24,up));
      color=mix(color,mix(vec3(.81,.93,.93),vec3(1.0,.99,.91),cloud.r),cover*1.6);gl_FragColor=vec4(color,1.0);}`
  });
  const sky=new Group();sky.name='sunny-cartoon-sky';
  sky.add(new Mesh(new THREE.SphereGeometry(1100,40,24),material));
  const puffs=new InstancedMesh(new THREE.SphereGeometry(1,12,8),new MeshBasicMaterial({color:0xfffdec}),48);
  const transform=new THREE.Object3D();
  for(let i=0;i<48;i++){
    const bank=Math.floor(i/4),part=i%4,angle=bank/12*Math.PI*2;
    const radius=310+(bank%3)*36;
    transform.position.set(Math.cos(angle)*radius+Math.sin(angle)*(part-1.5)*12,42+(bank%4)*7+[0,7,5,-1][part],Math.sin(angle)*radius-Math.cos(angle)*(part-1.5)*12);
    transform.scale.set(15+part%2*7,7+part%3*3,12);transform.updateMatrix();
    puffs.setMatrixAt(i,transform.matrix);puffs.setColorAt(i,new THREE.Color(part===0?0xe4f3ef:0xfffdec));
  }
  puffs.instanceMatrix.needsUpdate=true;sky.add(puffs);
  const sun=new Mesh(new THREE.SphereGeometry(22,20,14),new MeshBasicMaterial({color:0xffedac}));
  sun.position.set(340,230,-300);sky.add(sun);
  return sky;
}

function installOriginalInput(webgl,canvas) {
  const held=new Set(),stick=new THREE.Vector2();let pointer=null;
  const keys=new Set(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowLeft','ArrowDown','ArrowRight']);
  addEventListener('keydown',event=>{
    if(webgl.app.__quickGame?.active || event.target?.closest?.('input,textarea,select,[contenteditable=true]'))return;
    if(webgl.app.__hub?.active && ['KeyQ','KeyR'].includes(event.code)){
      event.preventDefault();if(!event.repeat)webgl.scenes.list.IslandWest.camera.turn(event.code==='KeyQ'?-1:1);return;
    }
    if(keys.has(event.code)){event.preventDefault();held.add(event.code);}
  });
  addEventListener('keyup',event=>held.delete(event.code));
  const joystick=document.createElement('div');joystick.className='original-joystick';document.body.append(joystick);
  const clearInput=()=>{held.clear();stick.set(0,0);pointer=null;joystick.classList.remove('active');webgl.movement.set(0,0);};
  webgl.clearInput=clearInput;
  addEventListener('blur',clearInput);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)clearInput();});
  canvas.addEventListener('pointerdown',event=>{
    if(pointer||event.button>0||webgl.app.__runner?.active||webgl.app.__quickGame?.active)return;
    pointer={id:event.pointerId,x:event.clientX,y:event.clientY};
    try { canvas.setPointerCapture(event.pointerId); } catch { /* Synthetic input has no captured native pointer. */ }
    joystick.style.left=pointer.x+'px';joystick.style.top=pointer.y+'px';joystick.classList.add('active');
  });
  canvas.addEventListener('pointermove',event=>{
    if(pointer?.id!==event.pointerId)return;
    stick.set(-(event.clientY-pointer.y)/60,(event.clientX-pointer.x)/60);if(stick.length()>1)stick.normalize();
    joystick.style.setProperty('--dx',stick.y*24+'px');joystick.style.setProperty('--dy',-stick.x*24+'px');
  });
  const release=event=>{if(pointer?.id===event.pointerId){pointer=null;stick.set(0,0);joystick.classList.remove('active');}};
  canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('lostpointercapture',release);
  return ()=>{
    if(webgl.app.__quickGame?.active){clearInput();webgl.movement.set(0,0);return;}
    const up=held.has('KeyW')||held.has('ArrowUp'),down=held.has('KeyS')||held.has('ArrowDown');
    const right=held.has('KeyD')||held.has('ArrowRight'),left=held.has('KeyA')||held.has('ArrowLeft');
    const hub=webgl.app.__hub, inHub=!!hub?.active;
    // One thumb can look all the way around the garden. Horizontal drag turns
    // in place; vertical drag walks, and diagonals steer while walking.
    // A small dead zone keeps a nearly vertical drag from drifting sideways.
    if(inHub && !hub.busy && !hub.scene.camera.locks.size &&
      !webgl.app.$store.isCustomizeOpen && !webgl.app.$store.isDialogVisible){
      const turn=Math.sign(stick.y)*Math.max(0,(Math.abs(stick.y)-.12)/.88);
      const dt=Math.min(Math.max(webgl.time.dt/1000,0),.05);
      hub.scene.camera.hubYaw+=turn*1.9*dt;
    }
    webgl.movement.set(Number(up)-Number(down)+stick.x,Number(right)-Number(left)+(inHub?0:stick.y));
    if(webgl.movement.length()>1)webgl.movement.normalize();
  };
}

        cz = origin.z + collider.z;

          dz = position.z - cz;

          dz = position.z - cz;

          z = -dx * sin + dz * cos;

          hz = collider.depth / 2 + radius;

  };

      ctx.font='700 27px Outfit,Arial,sans-serif';ctx.fillStyle=bossUnlocked?'#ffdc88':'#d6b9dc';
      ctx.fillText(bossUnlocked?(bossDefeated?'Defeated · Play again':'Unlocked · Walk through'):`Locked · ${bossCompletionCount}/4 games`,256,88);
    }
    texture.needsUpdate=true;
  }
  if(typeof document!=='undefined'&&document.createElement) {
    for(const definition of shrineDefinitions) {

  }
  group.userData.setBossProgress=(count,unlocked,defeated=false)=>{
    const changed=bossCompletionCount!==count||bossUnlocked!==!!unlocked||bossDefeated!==!!defeated;

    if(changed) {
      const sign=shrineSigns.find(entry=>entry.definition.id==='boss');
      if(sign)drawShrineSign(sign);
    }
  };

  // orbits add life without particles, timers, textures, or expensive simulation.

  for(let index=0;index<6;index++) {
    const origin=[[-15,22],[17,22],[-16,-25],[21,-24],[-7,28],[14,3]][index];
    const vertices=[];
    const wing=[[-.06,-.12],[-.30,-.49],[-.57,-.48],[-.69,-.27],[-.49,.02],[-.53,.27],[-.32,.44],[-.13,.30]];
    for(const side of [-1,1]) for(let i=0;i<wing.length-1;i++) {

    const wingColors=[];
    for(let vertex=0;vertex<vertices.length/3;vertex++) {
      const color=vertex<wingVertexCount?wingColor:0x526a68;
      wingColors.push((color>>16&255)/255,(color>>8&255)/255,(color&255)/255);
    }
    const flutterGeometry=new BufferGeometry();
    flutterGeometry.setAttribute('position',new BufferAttribute(new Float32Array(vertices),3));
    flutterGeometry.setAttribute('color',new BufferAttribute(new Float32Array(wingColors),3));
    const flutter=new Mesh(flutterGeometry,butterflyMaterial);
    flutter.name='garden-butterfly-'+(index+1);
    group.add(flutter);

    }

  group.userData.colliders = colliders;
  group.userData.shrines = shrineDefinitions;
  group.userData.artBudget = {
    drawCalls: 2 + butterflies.length + shrineSigns.length,
    triangles: positions.length / 9 + butterflyTriangles + 32 + shrineSigns.length*2,
    vertexBytes: (positions.length + colors.length) * 4,
    textures: shrineSigns.length,
    generatedSignTextureBytes: shrineSigns.length*512*128*4,
    grassTriangles,
    grassPatches,
    grassTufts,
    cloverMarks,
    shrineCount: shrineDefinitions.length,
    butterflies: butterflies.length,
    decorativeSpring: spring
  };
  scene.base.add(group);
  return group;
}

    if(!c.active||c.run.phase==='paused')return;
    dt=Math.min(Math.max(dt,0),.05);visualTime+=dt;
    const r=c.run;
    if(r.phase==='playing'){
      r.elapsed+=dt;r.invincible=Math.max(0,r.invincible-dt);r.fireCooldown=Math.max(0,r.fireCooldown-dt);r.dashCooldown=Math.max(0,r.dashCooldown-dt);r.dashRemaining=Math.max(0,r.dashRemaining-dt);
      const requestingJet=held.has('Space')||jetHeld;
      if(!requestingJet)r.jetExhausted=false;
      r.jetActive=requestingJet&&!r.jetExhausted&&r.jetFuel>0;
      if(r.jetActive){r.jetFuel=Math.max(0,r.jetFuel-dt*55);if(r.jetFuel===0)r.jetExhausted=true;r.jetSeconds+=dt;r.jumpVelocity=Math.min(5.5,r.jumpVelocity+dt*28);}
      else if(c.player.y<=.2)r.jetFuel=Math.min(100,r.jetFuel+dt*25);
      if(c.player.y>.18||r.jumpVelocity>0){
        r.jumpVelocity-=dt*(r.jetActive?7:24);
        c.player.y=THREE.MathUtils.clamp(c.player.y+r.jumpVelocity*dt,.18,3.6);
        if(c.player.y===.18||c.player.y===3.6)r.jumpVelocity=0;
      }
      let dx=Number(held.has('KeyD')||held.has('ArrowRight'))-Number(held.has('KeyA')||held.has('ArrowLeft'))+touch.x;
      let dz=Number(held.has('KeyS')||held.has('ArrowDown'))-Number(held.has('KeyW')||held.has('ArrowUp'))+touch.z;
      const length=Math.hypot(dx,dz);if(length>1){dx/=length;dz/=length;}
      if(length>.05){r.directionX=dx;r.directionZ=dz;c.avatar.group.rotation.y=Math.atan2(dx,dz);}
      const speed=r.dashRemaining>0?18:6.8;
      c.player.x=THREE.MathUtils.clamp(c.player.x+(r.dashRemaining>0?r.directionX:dx)*speed*dt,-7.2,7.2);
      c.player.z=THREE.MathUtils.clamp(c.player.z+(r.dashRemaining>0?r.directionZ:dz)*speed*dt,-3.5,7.3);
      if(visualTime>reactionUntil)c.avatar.setAnimation(length>.05?'Run':'Idle');
      if(held.has('KeyF'))fire();
      r.cycleTime+=dt;
      if(r.cycleTime>=1&&!r.volley){r.volley=true;volley();}
      if(r.cycleTime>=1.55&&!r.slam){
        r.slam=true;c.marks.forEach((mark,i)=>{if(i<r.stage){burst(new THREE.Vector3(mark.x,.2,mark.z),8);if(c.player.y<.9&&Math.hypot(c.player.x-mark.x,c.player.z-mark.z)<mark.radius+.38)hurt();}mark.mesh.visible=false;});
      }
      if(r.cycleTime>=2.2&&r.stage>1&&!r.secondVolley){r.secondVolley=true;volley(.08);}
      if(r.cycleTime>=2.4&&!r.wave){r.wave=true;shockwave();}
      if(r.cycleTime>=3.7&&r.stage===3&&!r.secondWave){r.secondWave=true;shockwave();}
      r.vulnerable=r.cycleTime>=3.2;
      if(r.cycleTime>=r.cycleDuration)newCycle();
      for(const mark of c.marks){const scale=mark.radius*(.82+Math.min(1,r.cycleTime/1.55)*.18);mark.mesh.scale.setScalar(scale);}
      for(const wave of c.waves){
        if(!wave.active)continue;wave.radius+=wave.speed*dt;wave.mesh.scale.setScalar(wave.radius);
        const distance=Math.hypot(c.player.x,c.player.z+6.5);
        if(!wave.passed&&wave.radius>=distance-.45){wave.passed=true;if(c.player.y<.9)hurt();else r.wavesJumped++;}
        if(wave.radius>19){wave.active=false;wave.mesh.visible=false;}
      }
      for(let i=c.bolts.length-1;i>=0;i--){const b=c.bolts[i];b.x+=b.vx*dt;b.z+=b.vz*dt;if(Math.abs(c.player.y+.85-b.y)<.8&&Math.hypot(b.x-c.player.x,b.z-c.player.z)<.68){c.bolts.splice(i,1);hurt();if(r.phase!=='playing')break;}else if(Math.abs(b.x)>11||b.z>12||b.z< -11)c.bolts.splice(i,1);}
      for(let i=c.shots.length-1;i>=0;i--){
        const b=c.shots[i];b.x+=b.vx*dt;b.z+=b.vz*dt;b.y=THREE.MathUtils.lerp(b.y,warden.position.y-.35,dt*4);
        if(Math.hypot(b.x,b.z+6.5)<1.2){c.shots.splice(i,1);burst(new THREE.Vector3(b.x,b.y,b.z),5);if(r.vulnerable){r.bossHealth--;r.shotsHit++;if(r.bossHealth<=0){r.bossHealth=0;finish(true);break;}}}
        else if(b.z< -10||Math.abs(b.x)>12)c.shots.splice(i,1);
      }
      if(r.elapsed>=ROUND_SECONDS&&r.phase==='playing')finish(false);
    }
    warden.position.y=2.6+Math.sin(visualTime*2)*.16;warden.rotation.z=Math.sin(visualTime*1.3)*.025;
    const defeated=r.phase==='won';shell.scale.set(defeated?1.4:2,defeated?1.26:1.8,defeated?.945:1.35);
    core.material=defeated||r.vulnerable?mint:hot;core.rotation.z=visualTime*(r.vulnerable?3:.6);crown.rotation.z=visualTime*.2;
    leftEye.material=rightEye.material=defeated?mint:hot;
    c.avatar.group.position.copy(c.player);c.avatar.group.visible=r.invincible<=0||Math.floor(visualTime*14)%2===0;c.avatar.update(dt);
    jetpack.position.copy(c.player);jetpack.rotation.y=c.avatar.group.rotation.y;
    jetpack.visible=c.avatar.group.visible;
    for(const flame of jetFlames){flame.visible=r.phase==='playing'&&r.jetActive;flame.scale.y=1+Math.sin(visualTime*45)*.2;}
    shadow.position.set(c.player.x,.065,c.player.z);
    for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vy-=9*dt;if(p.life<=0)particles.splice(i,1);}
    drawPool(enemyBatch,c.bolts,.27);drawPool(shotBatch,c.shots,.18);drawPool(sparks,particles,.13);paint();
    c.bolts.forEach((bolt,i)=>enemyBatch.setColorAt(i,new THREE.Color(bolt.airborne?0x8cefff:0xff9ba3)));
    if(enemyBatch.instanceColor)enemyBatch.instanceColor.needsUpdate=true;
  };
  c.fire=fire;c.dash=dash;c.jump=jump;
  return c;
}

// Friendly island residents, an original hat stall, and a very literal sign.
// Everything is generated locally. No character geometry or rig is modified.
function installHubResidents(app, hub) {
  if (app.__hatShop) return app.__hatShop;
  const storageKey = 'glorb-hats-v1';
  const catalog = [
    {id:'samurai', name:'Samurai', price:50, color:'#65547a'},
    {id:'cowboy', name:'Cowboy', price:35, color:'#b47e4c'},
    {id:'cap', name:'hat', price:20, color:'#6598c7'}
  ];
  const state = {stars:30, owned:new Set(), equipped:null};
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey) || 'null');
    if (saved?.version === 1) {
      if (Number.isFinite(saved.stars)) state.stars = Math.max(0, Math.floor(saved.stars));
      if (Array.isArray(saved.owned)) for (const id of saved.owned) {
        if (catalog.some(hat => hat.id === id)) state.owned.add(id);
      }
      if (state.owned.has(saved.equipped)) state.equipped = saved.equipped;
    }
  } catch (error) { /* The shop also works when local storage is unavailable. */ }

  const group = new THREE.Group();
  group.name = 'glorb-island-residents';
  group.position.copy(hub.group.position);
  hub.scene.base.add(group);
  const shop = {
    group, state, catalog, residents:[], merchant:null, isOpen:false,
    position:{x:17,z:0}, signPosition:{x:40,z:42}, disposed:false
  };
  app.__hatShop = shop;
  app.__hubResidents = shop;
  const attachedHats = new Map();
  const automaticAvatars = new Set();
  const fixedHatIds = new WeakMap();
  const ownedHatGroups = new WeakSet();
  const ownColliders = [];
  const sceneryResources = new Set();
  const floorOrigin = new THREE.Vector3();
  const localPlayer = new THREE.Vector3();
  let visualTime = 0;
  let isNearMerchant = false;
  let dismissedNearby = false;
  let lastUi = '';

  function save() {
    try {
      localStorage.setItem(storageKey, JSON.stringify({
        version:1, stars:state.stars, owned:[...state.owned], equipped:state.equipped
      }));
    } catch (error) { /* Wallet and hats remain usable for this session. */ }
  }

  function disposeObjectResources(root) {
    const geometries = new Set(), materials = new Set(), textures = new Set();
    root.traverse(object => {
      if (object.geometry) geometries.add(object.geometry);
      const surfaces = Array.isArray(object.material) ? object.material : [object.material];
      for (const surface of surfaces) if (surface) {
        materials.add(surface);
        if (surface.map) textures.add(surface.map);
      }
    });
    for (const geometry of geometries) geometry.dispose();
    for (const material of materials) material.dispose();
    for (const texture of textures) texture.dispose();
    root.removeFromParent();
  }

  function roundedRectangle(context, x, y, width, height, radius) {
    context.beginPath();
    context.moveTo(x + radius, y);
    context.lineTo(x + width - radius, y);
    context.quadraticCurveTo(x + width, y, x + width, y + radius);
    context.lineTo(x + width, y + height - radius);
    context.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
    context.lineTo(x + radius, y + height);
    context.quadraticCurveTo(x, y + height, x, y + height - radius);
    context.lineTo(x, y + radius);
    context.quadraticCurveTo(x, y, x + radius, y);
    context.closePath();
  }

  function textTexture(text, foreground, background, width=512, height=128) {
    const canvas = document.createElement('canvas');
    canvas.width = width; canvas.height = height;
    const context = canvas.getContext('2d');
    const texture = new THREE.CanvasTexture(canvas);
    texture.minFilter = THREE.LinearFilter;
    texture.generateMipmaps = false;
    const draw = () => {
      context.clearRect(0, 0, width, height);
      if (background) {context.fillStyle = background;context.fillRect(0, 0, width, height);}
      context.fillStyle = foreground;
      context.font = `800 ${Math.round(height * .48)}px Outfit,Arial,sans-serif`;
      context.textAlign = 'center'; context.textBaseline = 'middle';
      context.fillText(text, width / 2, height / 2, width * .93);
      texture.needsUpdate = true;
    };
    draw(); document.fonts?.ready?.then(draw);
    return texture;
  }

  function buildHat(id) {
    const hat = new THREE.Group();
    hat.name = 'glorb-hat-' + id;
    hat.userData.glorbHat = true;
    hat.userData.hatId = id;
    ownedHatGroups.add(hat);
    const material = color => new THREE.MeshPhongMaterial({color, shininess:10, side:THREE.DoubleSide});
    function part(geometry, surface, position, scale=[1,1,1]) {
      const item = new THREE.Mesh(geometry, surface);
      item.position.set(...position); item.scale.set(...scale); hat.add(item); return item;
    }
    if (id === 'samurai') {
      const armor = material(0x393849), edge = material(0x685a75), gold = material(0xf4c56c);
      part(new THREE.SphereGeometry(.42, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), armor, [0,.025,0], [1,1,.93]);
      part(new THREE.CylinderGeometry(.48,.53,.09,16), edge, [0,.018,0], [1,1,.93]);
      for (const side of [-1,1]) for (let row=0;row<3;row++) {
        part(new THREE.BoxGeometry(.14,.10,.42), row % 2 ? armor : edge,
          [side * (.39 + row * .025),-.055 + row * .07,-.05]);
      }
      const crest = part(new THREE.TorusGeometry(.22,.038,6,18,Math.PI), gold, [0,.38,.335]);
      crest.rotation.z = Math.PI;
      for (const side of [-1,1]) {
        const horn = part(new THREE.ConeGeometry(.065,.36,7), gold, [side*.19,.49,.335]);
        horn.rotation.z = -side*.38;
      }
      part(new THREE.OctahedronGeometry(.10), gold, [0,.28,.407], [1,1,.4]);
    } else if (id === 'cowboy') {
      const felt = material(0xc99a62), band = material(0x754b3e), gold = material(0xf6cf7b);
      const brimGeometry = new THREE.RingGeometry(.22,.65,32,3);
      const points = brimGeometry.attributes.position;
      for (let i=0;i<points.count;i++) {
        const x=points.getX(i), z=points.getY(i)*.82;
        points.setXYZ(i,x,.012 + .13 * (Math.abs(x) / .65) ** 4,z);
      }
      brimGeometry.computeVertexNormals();
      part(brimGeometry, felt, [0,0,0]);
      part(new THREE.CylinderGeometry(.29,.37,.36,14), felt, [0,.19,0], [1,1,.85]);
      part(new THREE.CylinderGeometry(.372,.388,.085,14), band, [0,.09,0], [1,1,.86]);
      part(new THREE.BoxGeometry(.15,.105,.027), gold, [0,.105,.328]);
      part(new THREE.BoxGeometry(.081,.049,.031), band, [0,.105,.344]);
      part(new THREE.SphereGeometry(.30,12,6), felt, [0,.375,0], [1,.20,.80]);
    } else if (id === 'cap') {
      const cloth = material(0x6b9bce), visor = material(0x3f6895);
      part(new THREE.SphereGeometry(.42,16,8,0,Math.PI*2,0,Math.PI/2), cloth, [0,.005,0], [1,1,.96]);
      const visorGeometry = new THREE.CircleGeometry(.43,24,0,Math.PI);
      const points = visorGeometry.attributes.position;
      for (let i=0;i<points.count;i++) points.setXYZ(i,points.getX(i),.009,points.getY(i)*.81+.19);
      visorGeometry.computeVertexNormals();
      part(visorGeometry, visor, [0,0,0]);
      part(new THREE.SphereGeometry(.052,8,6), visor, [0,.425,0]);
      const lettering = new THREE.MeshBasicMaterial({map:textTexture('hat','#28435f','#fff1d2',256,96),side:THREE.DoubleSide});
      part(new THREE.PlaneGeometry(.43,.17), lettering, [0,.19,.369]);
    }
    return hat;
  }

  function avatarRoot(avatar) { return avatar?.group || avatar?.base || avatar; }
  function detachHat(root) {
    const owned = attachedHats.get(root);
    if (owned) {disposeObjectResources(owned);attachedHats.delete(root);}
    // createGlorbAvatar clones the player's hierarchy. Remove inherited hats,
    // but never dispose geometry that still belongs to the source character.
    const inherited = [];
    root?.traverse(object => {if (object !== root && object.userData?.glorbHat) inherited.push(object);});
    for (const hat of inherited) {
      if (ownedHatGroups.has(hat)) disposeObjectResources(hat);
      else hat.removeFromParent();
    }
  }
  shop.removeHatFromAvatar = avatar => {
    const root = avatarRoot(avatar);
    if (!root?.traverse) return;
    detachHat(root); automaticAvatars.delete(root);fixedHatIds.delete(root);
  };
  shop.applyHatToAvatar = (avatar, requestedId) => {
    const root = avatarRoot(avatar);
    if (!root?.traverse) return null;
    // Named residents keep their own equipment when a later color refresh
    // syncs their cloned avatar. Player and arcade avatars follow the wallet.
    if (requestedId !== undefined) fixedHatIds.set(root,requestedId);
    const fixed = fixedHatIds.has(root);
    if (fixed) automaticAvatars.delete(root);
    else automaticAvatars.add(root);
    const id = fixed ? fixedHatIds.get(root) : state.equipped;
    const existing = attachedHats.get(root);
    if (existing?.userData.hatId === id) return existing;
    detachHat(root);
    if (!catalog.some(hat => hat.id === id)) return null;
    let head;
    root.traverse(object => {if (object.isBone && /head/i.test(object.name)) head = object;});
    if (!head) return null;
    root.updateMatrixWorld(true);
    const position = root.worldToLocal(head.getWorldPosition(new THREE.Vector3()));
    // The supplied rig's head marker is just above its crown. Hat dimensions
    // are authored in metres; the avatar's canonical root scale is 0.01.
    position.y -= 7.5;
    const rootPlacement = new THREE.Matrix4().compose(position,new THREE.Quaternion(),new THREE.Vector3(100,100,100));
    const worldPlacement = new THREE.Matrix4().multiplyMatrices(root.matrixWorld,rootPlacement);
    const localPlacement = new THREE.Matrix4().copy(head.matrixWorld).invert().multiply(worldPlacement);
    const hat = buildHat(id);
    localPlacement.decompose(hat.position,hat.quaternion,hat.scale);
    head.add(hat);attachedHats.set(root,hat);
    return hat;
  };

  function applyEquippedHat() {
    shop.applyHatToAvatar(hub.scene.player);
    for (const root of [...automaticAvatars]) shop.applyHatToAvatar(root);
  }
  shop.addStars = amount => {
    if (!Number.isFinite(amount) || amount <= 0) return state.stars;
    state.stars += Math.floor(amount);save();paintShop();return state.stars;
  };
  shop.buy = id => {
    const hat = catalog.find(item => item.id === id);
    if (!hat || state.owned.has(id) || state.stars < hat.price) return false;
    state.stars -= hat.price;state.owned.add(id);state.equipped=id;
    save();applyEquippedHat();paintShop();
    app.$webgl.audio?.playSound('hat_purchase');
    return true;
  };
  shop.equip = id => {
    if (id !== null && !state.owned.has(id)) return false;
    state.equipped=id;save();applyEquippedHat();paintShop();return true;
  };

  function surface(color) {
    const material = new THREE.MeshPhongMaterial({color,shininess:7});
    sceneryResources.add(material);return material;
  }
  const wood=surface(0xc58a58), darkWood=surface(0x896146), cream=surface(0xffe5b5);
  const mint=surface(0x57bca9), coral=surface(0xf59c8b), gold=surface(0xf0c56c);
  const unitBox = new THREE.BoxGeometry(1,1,1);sceneryResources.add(unitBox);
  function sceneryMesh(geometry,material,position,scale=[1,1,1],parent=group) {
    sceneryResources.add(geometry);
    const item = new THREE.Mesh(geometry,material);
    item.position.set(...position);item.scale.set(...scale);parent.add(item);return item;
  }
  function box(x,y,z,width,height,depth,material,parent=group) {
    return sceneryMesh(unitBox,material,[x,y,z],[width,height,depth],parent);
  }
  function addCollider(collider) {ownColliders.push(collider);hub.group.userData.colliders.push(collider);}
  const stall = new THREE.Group();stall.name='glorb-hat-stall';stall.position.set(17,0,0);group.add(stall);
  box(0,.10,0,7,.2,4,cream,stall);
  for (const side of [-1,1]) {
    box(side*3,2.44,-.75,.22,4.88,.22,darkWood,stall);
    box(side*3,1.0,1.25,.22,2,.22,darkWood,stall);
  }
  for (let i=0;i<9;i++) box(-2.64+i*.66,.77,.9,.59,1.28,.16,i%2?wood:cream,stall);
  box(0,1.52,.60,6.35,.24,1.35,wood,stall);
  box(0,.33,.5,6.7,.17,1.5,darkWood,stall);
  box(0,.27,-1.8,2.5,.54,1.6,wood,stall);
  for (let stripe=0;stripe<7;stripe++) {
    box(-2.85+stripe*.95,4.84,-.03,.94,.15,3.6,stripe%2?cream:mint,stall);
    const scallop = sceneryMesh(new THREE.CylinderGeometry(.475,.475,.14,12,1,false,0,Math.PI),
      stripe%2?cream:mint,[-2.85+stripe*.95,4.71,1.78],[1,1,1],stall);
    scallop.rotation.x=Math.PI/2;
  }
  box(0,4.43,1.82,3.7,.6,.12,darkWood,stall);
  const stallText = textTexture('HATS','#fff0ce',null);
  sceneryResources.add(stallText);
  const stallLettering = new THREE.MeshBasicMaterial({map:stallText,transparent:true});sceneryResources.add(stallLettering);
  sceneryMesh(new THREE.PlaneGeometry(3.25,.50),stallLettering,[0,4.44,1.89],[1,1,1],stall);
  addCollider({kind:'box',x:17,z:.65,width:6.65,depth:1.4,turn:0});
  for (const side of [-1,1]) addCollider({kind:'circle',x:17+side*3,z:-.75,radius:.22});
  const displayHats=[];
  for (let i=0;i<3;i++) {
    const displayHat = buildHat(catalog[i].id);
    displayHat.position.set([-2.65,-1.4,2.05][i],1.68,.61);displayHat.scale.setScalar(.83);stall.add(displayHat);displayHats.push(displayHat);
  }

  const sign = new THREE.Group();sign.name='literal-wooden-sign';sign.position.set(40,0,42);sign.rotation.y=Math.atan2(-40,-42);group.add(sign);
  box(0,1.10,0,.28,2.2,.27,darkWood,sign);
  box(0,2.08,0,4.2,1.15,.22,wood,sign);
  for (const side of [-1,1]) sceneryMesh(new THREE.SphereGeometry(.055,6,4),darkWood,[side*1.85,2.08,.135],[1,1,1],sign);
  const signTexture=textTexture('this is a sign','#493a2f','#e5b987');sceneryResources.add(signTexture);
  const signMaterial=new THREE.MeshBasicMaterial({map:signTexture});sceneryResources.add(signMaterial);
  sceneryMesh(new THREE.PlaneGeometry(3.9,.89),signMaterial,[0,2.08,.125],[1,1,1],sign);
  addCollider({kind:'circle',x:40,z:42,radius:.28});
  // Batch the stall slats, roof stripes and sign planks by material. Each
  // retains its individual transform without paying a draw call per plank.
  group.updateMatrixWorld(true);
  const inverseGroup=new THREE.Matrix4().copy(group.matrixWorld).invert();
  const plankGroups=new Map();
  for(const root of [stall,sign])root.traverse(object=>{
    if(object.geometry!==unitBox)return;
    if(!plankGroups.has(object.material))plankGroups.set(object.material,[]);
    plankGroups.get(object.material).push(object);
  });
  for(const [material,planks] of plankGroups) {
    const batch=new THREE.InstancedMesh(unitBox,material,planks.length);
    batch.name='hat-stall-plank-batch';
    const matrix=new THREE.Matrix4();
    planks.forEach((plank,index)=>{
      matrix.multiplyMatrices(inverseGroup,plank.matrixWorld);batch.setMatrixAt(index,matrix);plank.removeFromParent();
    });
    group.add(batch);
  }

  function setResidentColor(avatar,color) {
    avatar.group.traverse(object => {
      if (!object.isSkinnedMesh) return;
      const surfaces=Array.isArray(object.material)?object.material:[object.material];
      for (const material of surfaces) material.color?.setHex(color);
    });
  }
  function createResident(name,color,position,route,scale=.0105) {
    const avatar=createGlorbAvatar(app);shop.removeHatFromAvatar(avatar);
    avatar.group.name=name;avatar.group.userData.hubResident=true;
    avatar.group.position.set(position[0],.015,position[1]);avatar.group.scale.setScalar(scale);
    setResidentColor(avatar,color);avatar.setAnimation('Idle');group.add(avatar.group);
    const resident={name,avatar,route,index:0,wait:1.1,blocked:0,animation:'Idle',speed:1.35};

        const won=id==='runner'?(run?.missionComplete||run?.coins>=50):run?.phase==='won';
        if(won&&run&&!rewardedRuns.has(run)&&app.__hatShop){rewardedRuns.add(run);app.__hatShop.addStars(amount);}
      }
      // Record milestones even while the hub itself is hidden by another game.
      if(app.__survival?.run?.phase==='won') c.completeActivity('survival');
      if(app.__runner?.run?.missionComplete||app.__runner?.run?.coins>=50) c.completeActivity('runner');
      if(app.__ufoFlight?.run?.phase==='won') c.completeActivity('ufo-flight');
      if(app.__bubbleBlitz?.run?.phase==='won') c.completeActivity('bubble-blitz');
      if(app.__bossFight?.run?.phase==='won') c.completeBoss();
      if (!c.active || c.busy) return;
      c.scene.getCurrentCamera().unlockPlayer('survival');
      if (app.$store.isCustomizeOpen) return;
      const p = c.scene.player.base.position;
      const shrine = c.shrines.find(entry => Math.hypot(
        p.x - c.group.position.x - entry.x,
        p.z - c.group.position.z - entry.z
      ) < 3.8);
      if (shrine?.id === 'survival') c.enter();
      else if (shrine?.id === 'runner') c.enterRunner();
      else if (shrine?.id === 'ufo-flight' || shrine?.id === 'bubble-blitz') c.enterQuickGame(shrine.id);
      else if(shrine?.id==='boss') {
        if(c.isBossUnlocked()) c.enterQuickGame('boss');
        else if(c.nearbyShrine!=='boss') showNotice(`Dread Shrine is sealed. Complete all four games: ${completed.size}/4 earned.`);
      }
      c.nearbyShrine = shrine?.id || null;
    });
  }, 50);
  return c;
}

startOriginalEngine().catch(error => {
  console.error(error);
  const counter = document.querySelector('.preloader-counter');
  counter.textContent = 'Could not load the local game: ' + error.message;
});
</script></body></html>
