<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#70bfe4">
    <title>glorb</title>
    <style>
      :root {
        --ink: #2b2860;
        --foam: #f4fbff;
        --sky: #70bfe4;
        --neon: #3dff6a;
        --warn: #7b3cff;
        --good: #02c6a7;
        --red: #f54721;
        --yellow: #f6d35f;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: #101428;
        color: var(--ink);
        font-family: ui-rounded, "Trebuchet MS", "Segoe UI", sans-serif;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      #frame {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #game {
        position: relative;
        width: min(100vw, calc(100vh * 9 / 16));
        height: min(100vh, calc(100vw * 16 / 9));
        overflow: hidden;
        background: var(--sky);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08);
      }

      #game canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .hit { pointer-events: auto; }

      button {
        font: inherit;
        border: 0;
        cursor: pointer;
        color: var(--ink);
      }

      #top {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 0;
        display: none;
        flex-direction: column;
        gap: 8px;
      }

      #top.visible { display: flex; }

      .meter {
        height: 18px;
        border-radius: 999px;
        background: rgba(17, 12, 40, 0.45);
        overflow: hidden;
        box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.35);
      }

      .meter > span {
        display: block;
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #9d4edd, #f54721);
        transition: width 0.2s linear;
      }

      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        color: #fff;
        text-shadow: 0 1px 4px rgba(20, 16, 50, 0.7);
        font-weight: 700;
        font-size: 14px;
      }

      #mute {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.92);
        font-size: 18px;
        flex: 0 0 auto;
      }

      #speech {
        position: absolute;
        left: 50%;
        top: 18%;
        width: min(78%, 280px);
        transform: translateX(-50%);
        background: #fff;
        border-radius: 18px 18px 18px 6px;
        padding: 12px 14px;
        font-size: 15px;
        font-weight: 700;
        line-height: 1.35;
        box-shadow: 0 10px 24px rgba(43, 40, 96, 0.25);
        display: none;
      }

      #speech.visible { display: block; }

      #bottom {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px));
        display: none;
        justify-content: space-between;
        align-items: flex-end;
      }

      #bottom.visible { display: flex; }

      #stick {
        width: 132px;
        height: 132px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
        box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.45);
        position: relative;
      }

      #knob {
        width: 58px;
        height: 58px;
        border-radius: 50%;
        background: #fff;
        position: absolute;
        left: 37px;
        top: 37px;
        box-shadow: 0 6px 0 rgba(43, 40, 96, 0.18);
      }

      #act {
        width: 86px;
        height: 86px;
        border-radius: 50%;
        background: var(--good);
        color: #fff;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.04em;
        box-shadow: 0 8px 0 #0a7d6a;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 8px;
        line-height: 1.15;
        position: relative;
      }

      #act.visible { display: flex; }
      #act:disabled {
        background: #9e9bbe;
        box-shadow: 0 8px 0 #6e6b8c;
      }

      #act .ring {
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        border: 4px solid rgba(255, 255, 255, 0.85);
        clip-path: inset(0 50% 0 0);
        transform: rotate(0deg);
        display: none;
      }

      #cover {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 28px 22px calc(28px + env(safe-area-inset-bottom, 0px));
        background: linear-gradient(180deg, rgba(16, 20, 40, 0) 52%, rgba(16, 20, 40, 0.78) 100%);
      }

      #cover.hidden { display: none; }

      #cover h1 {
        margin: 0 0 8px;
        font-size: 48px;
        line-height: 0.9;
        color: #fff;
        letter-spacing: -0.04em;
      }

      #cover p {
        margin: 0 0 18px;
        color: #e8fbff;
        font-size: 16px;
        font-weight: 700;
        max-width: 16em;
      }

      .cta {
        width: 100%;
        height: 56px;
        border-radius: 18px;
        background: #fff;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.08em;
        box-shadow: 0 7px 0 rgba(43, 40, 96, 0.28);
      }

      .cta.again {
        background: var(--yellow);
      }

      #end-title { font-size: 32px; }
    </style>
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.min.js" } }
    </script>
  </head>
  <body>
    <div id="frame">
      <div id="game"></div>
    </div>
    <script type="module">
__GAME_CODE__
    </script>
  </body>
</html>
